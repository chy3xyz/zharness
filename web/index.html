<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>zharness</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<div class="app">

  <!-- ── session sidebar ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="brand-mark">z</span><span>zharness</span></div>
      <button id="btn-new" class="btn-new" type="button" title="Start a new session">＋ New session</button>
    </div>
    <nav id="session-list" class="session-list" aria-label="Sessions"></nav>
    <div class="sidebar-foot">local · zero-build client</div>
  </aside>

  <!-- ── main column ─────────────────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <button id="btn-nav" class="icon-btn nav-toggle" type="button" aria-label="Toggle sessions panel">☰</button>
      <h1 id="view-title" class="view-title">New session</h1>
      <span class="spacer"></span>
      <span id="ticker" class="ticker" role="status" aria-live="polite"></span>
      <span class="health" title="GET /healthz every 15s">
        <span id="health-dot" class="dot dot-idle"></span>
        <span id="health-label" class="health-label">connecting…</span>
      </span>
    </header>

    <div id="offline-banner" class="offline-banner hidden" role="alert">
      zharness server unreachable — retrying every 15&nbsp;seconds…
    </div>

    <section id="transcript" class="transcript" aria-live="polite" aria-label="Conversation"></section>

    <footer class="composer-wrap">
      <div id="readonly-note" class="readonly-note hidden">
        Read-only history view — start a new session to continue chatting.
      </div>
      <div class="composer">
        <textarea id="prompt" rows="1"
          placeholder="Send a task to zharness…  (Enter to send · Shift+Enter for a newline)"
          aria-label="Prompt"></textarea>
        <button id="btn-send" class="btn-send" type="button" title="Send prompt">↑</button>
      </div>
    </footer>
  </main>
</div>

<script src="/assets/app.js" defer></script>
</body>
</html>
